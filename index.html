<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30 Days, 30 Apps</title>
<meta name="description" content="One new browser app every day for 30 days. Built in public by @tirupathipodugu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#f3f4f8;--surface:#fff;--fg:#141826;--muted:#5a6076;--line:#dcdfe9;--accent:#e4572e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1120;--surface:#171b2e;--fg:#eceef7;--muted:#9aa1bd;--line:#2a3050;--accent:#ff7a52;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Figtree,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:48px 16px 64px}
h1{font:700 clamp(36px,7vw,72px)/1 Unbounded,system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 12px}
h1 span{color:var(--accent)}
.lead{color:var(--muted);max-width:60ch;margin:0 0 32px}
.lead a{color:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{display:grid;gap:6px;padding:18px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.day{font:500 13px Unbounded,system-ui,sans-serif;color:var(--accent)}
.name{font-weight:600;font-size:19px}
.hook{color:var(--muted);font-size:14.5px}
.soon{opacity:.5;pointer-events:none}
.empty{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>30 Days, <span>30 Apps</span></h1>
  <p class="lead">One new app every day, built in public. Everything runs in your browser: camera apps never upload your video. Follow along on X: <a href="https://x.com/tirupathipodugu">@tirupathipodugu</a>.</p>
  <div class="grid" id="grid"><p class="empty">Day 1 is on its way.</p></div>
</div>
<script>
fetch("apps.json",{cache:"no-store"}).then(r=>r.json()).then(apps=>{
  if(!apps.length)return;
  const g=document.getElementById("grid");g.innerHTML="";
  for(const a of apps){
    const el=document.createElement("a");el.className="card";el.href=a.path;
    const d=document.createElement("span");d.className="day";d.textContent="Day "+a.day;
    const n=document.createElement("span");n.className="name";n.textContent=a.name;
    const h=document.createElement("span");h.className="hook";h.textContent=a.hook;
    el.append(d,n,h);g.append(el);
  }
}).catch(()=>{});
</script>
</body>
</html>
