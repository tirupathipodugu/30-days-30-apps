# Human vs AI game server (Cloudflare Workers + one Durable Object class).
name = "human-vs-ai"
main = "worker.js"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# SQLite-backed Durable Objects are the kind available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
